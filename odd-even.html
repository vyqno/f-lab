<!DOCTYPE html>
<html>
<head>
    <title>Odd or Even</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
        }

        #result {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Odd or Even</h1>

        <input type="number" id="number"
               placeholder="Enter a number">

        <br>

        <button onclick="checkOddEven()">
            Check
        </button>

        <p id="result"></p>

    </div>

    <script>
        function checkOddEven() {
            const numberInput = document.getElementById("number");
            const result = document.getElementById("result");
            const number = Number(numberInput.value);

            if (numberInput.value === "" || Number.isNaN(number)) {
                result.innerHTML = "Please enter a number.";
                return;
            }

            if (!Number.isInteger(number)) {
                result.innerHTML = "Please enter a whole number.";
                return;
            }

            if (number % 2 === 0) {
                result.innerHTML = number + " is even.";
            } else {
                result.innerHTML = number + " is odd.";
            }
        }
    </script>

</body>
</html>
