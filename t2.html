<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inner HTML, CSS, and Outer HTML</title>
  <style>
    .outer {
      border: 2px solid #333;
      padding: 16px;
      max-width: 480px;
    }

    .inner {
      background: #f0f4ff;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="outer" id="outer">
    <h2>What Can JavaScript Do?</h2>
    <div class="inner" id="inner">
      <p id="demo">JavaScript can change inner HTML, CSS, and outer HTML.</p>
    </div>
  </div>

  <p>
    <button type="button" onclick="document.getElementById('demo').innerHTML = 'Inner HTML updated.'">
      Change inner HTML
    </button>
    <button type="button" onclick="document.getElementById('demo').style.color = 'crimson'; document.getElementById('demo').style.fontSize = '24px'">
      Change CSS
    </button>
    <button type="button" onclick="document.getElementById('outer').outerHTML = '<p>Outer HTML replaced this whole box.</p>'">
      Change outer HTML
    </button>
  </p>
</body>
</html>
