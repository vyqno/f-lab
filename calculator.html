<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 280px;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 0 10px gray;
        }

        #display {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 22px;
            text-align: right;
            margin-bottom: 12px;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 14px 0;
            font-size: 16px;
            cursor: pointer;
        }

        .span-2 {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Calculator</h1>

        <input type="text" id="display" value="0" readonly>

        <div class="keys">
            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('%')">%</button>
            <button onclick="appendValue('/')">/</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">*</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>

            <button class="span-2" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculate()">=</button>
        </div>

    </div>

    <script>
        const display = document.getElementById("display");

        function appendValue(value) {
            if (display.value === "0" || display.value === "Error") {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteLast() {
            if (display.value.length <= 1 || display.value === "Error") {
                display.value = "0";
            } else {
                display.value = display.value.slice(0, -1);
            }
        }

        function calculate() {
            const result = evaluate(display.value);

            if (result === null || !Number.isFinite(result)) {
                display.value = "Error";
                return;
            }

            display.value = String(result);
        }

        function evaluate(expression) {
            const tokens = [];
            let i = 0;

            expression = expression.replace(/%/g, "/100");

            while (i < expression.length) {
                const ch = expression[i];

                if (ch === " ") {
                    i++;
                    continue;
                }

                if ((ch === "+" || ch === "-") &&
                    (tokens.length === 0 ||
                     typeof tokens[tokens.length - 1] === "string")) {
                    let num = ch;
                    i++;
                    while (i < expression.length &&
                           ((expression[i] >= "0" && expression[i] <= "9") ||
                            expression[i] === ".")) {
                        num += expression[i];
                        i++;
                    }
                    if (num === "+" || num === "-" || num === "+." || num === "-.") {
                        return null;
                    }
                    tokens.push(Number(num));
                    continue;
                }

                if ((ch >= "0" && ch <= "9") || ch === ".") {
                    let num = "";
                    while (i < expression.length &&
                           ((expression[i] >= "0" && expression[i] <= "9") ||
                            expression[i] === ".")) {
                        num += expression[i];
                        i++;
                    }
                    tokens.push(Number(num));
                    continue;
                }

                if ("+-*/".includes(ch)) {
                    tokens.push(ch);
                    i++;
                    continue;
                }

                return null;
            }

            if (tokens.length === 0) {
                return null;
            }

            const multiplied = [];
            let index = 0;

            multiplied.push(tokens[index++]);

            while (index < tokens.length) {
                const op = tokens[index++];
                const right = tokens[index++];

                if (typeof op !== "string" || typeof right !== "number") {
                    return null;
                }

                if (op === "*") {
                    multiplied[multiplied.length - 1] *= right;
                } else if (op === "/") {
                    if (right === 0) {
                        return null;
                    }
                    multiplied[multiplied.length - 1] /= right;
                } else if (op === "+" || op === "-") {
                    multiplied.push(op, right);
                } else {
                    return null;
                }
            }

            let result = multiplied[0];
            if (typeof result !== "number") {
                return null;
            }

            for (let j = 1; j < multiplied.length; j += 2) {
                const op = multiplied[j];
                const right = multiplied[j + 1];

                if (op === "+") {
                    result += right;
                } else if (op === "-") {
                    result -= right;
                } else {
                    return null;
                }
            }

            return result;
        }
    </script>

</body>
</html>
