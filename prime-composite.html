<!DOCTYPE html>
<html>
<head>
    <title>Prime or Composite</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
        }

        #result {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Prime or Composite</h1>

        <input type="number" id="number"
               placeholder="Enter a number">

        <br>

        <button onclick="checkPrimeComposite()">
            Check
        </button>

        <p id="result"></p>

    </div>

    <script>
        function isPrime(number) {
            if (number <= 1) {
                return false;
            }

            if (number === 2) {
                return true;
            }

            if (number % 2 === 0) {
                return false;
            }

            for (let i = 3; i * i <= number; i += 2) {
                if (number % i === 0) {
                    return false;
                }
            }

            return true;
        }

        function checkPrimeComposite() {
            const numberInput = document.getElementById("number");
            const result = document.getElementById("result");
            const number = Number(numberInput.value);

            if (numberInput.value === "" || Number.isNaN(number)) {
                result.innerHTML = "Please enter a number.";
                return;
            }

            if (!Number.isInteger(number)) {
                result.innerHTML = "Please enter a whole number.";
                return;
            }

            if (number <= 1) {
                result.innerHTML =
                    number + " is neither prime nor composite.";
                return;
            }

            if (isPrime(number)) {
                result.innerHTML = number + " is prime.";
            } else {
                result.innerHTML = number + " is composite.";
            }
        }
    </script>

</body>
</html>
