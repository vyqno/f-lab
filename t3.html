<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
        }

        #result {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Grade Calculator</h1>

        <input type="number" id="marks"
               placeholder="Enter marks">

        <br>

        <button onclick="calculateGrade()">
            Calculate Grade
        </button>

        <p id="result"></p>

    </div>

    <script src="t3.js"></script>

</body>
</html>
