<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --text: #1c1b19;
      --muted: #6b6860;
      --line: #e6e3dc;
      --accent: #1f4e3d;
      --accent-soft: #e8f0ec;
      --danger: #8b2e2e;
      --danger-soft: #f6eaea;
      --warn: #7a5a14;
      --warn-soft: #f7f0dc;
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .page {
      width: min(960px, calc(100% - 32px));
      margin: 40px auto 64px;
    }

    header { margin-bottom: 28px; }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .stat span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus, button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 45%, white);
      outline-offset: 1px;
    }

    small {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 4px;
    }

    button {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    button:hover { background: #f3f1ec; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: color-mix(in srgb, var(--accent) 88%, black);
    }

    button.danger {
      background: transparent;
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
      color: var(--danger);
    }

    button.danger:hover { background: var(--danger-soft); }

    button.small {
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    button.qty {
      padding: 2px 9px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 10px;
    }

    .toolbar label { font-size: 0.8rem; }

    .result-count {
      margin: 0 0 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }

    tbody tr:hover { background: #faf9f6; }

    .qty-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }

    .badge.low { background: var(--warn-soft); color: var(--warn); }
    .badge.out { background: var(--danger-soft); color: var(--danger); }

    .empty {
      margin: 0;
      padding: 28px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .msg {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .msg.show { display: block; }
    .msg.ok { background: var(--accent-soft); color: var(--accent); }
    .msg.err { background: var(--danger-soft); color: var(--danger); }

    .table-wrap { overflow-x: auto; }

    @media (max-width: 700px) {
      .row { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .page { margin-top: 24px; }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Inventory</h1>
      <p>Add, edit, search, and delete products. Quantity drives status and value.</p>
    </header>

    <div id="message" class="msg" role="status"></div>

    <section class="panel stats">
      <div class="stat"><strong id="stat-total">0</strong><span>Total products</span></div>
      <div class="stat"><strong id="stat-value">₹0</strong><span>Total inventory value</span></div>
      <div class="stat"><strong id="stat-low">0</strong><span>Low stock products</span></div>
    </section>

    <section class="panel">
      <form id="product-form">
        <input type="hidden" id="edit-id" value="">

        <div class="row">
          <label>
            Product ID
            <input type="text" id="product-id" placeholder="P101" maxlength="20" required>
            <small>Must be unique</small>
          </label>
          <label>
            Product name
            <input type="text" id="name" placeholder="Laptop" maxlength="60" required>
          </label>
        </div>

        <div class="row">
          <label>
            Category
            <select id="category" required>
              <option value="">Select</option>
              <option value="Electronics">Electronics</option>
              <option value="Clothing">Clothing</option>
              <option value="Food">Food</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>
            Price (₹)
            <input type="number" id="price" min="0" step="0.01" placeholder="50000" required>
          </label>
        </div>

        <div class="row">
          <label>
            Quantity
            <input type="number" id="quantity" min="0" step="1" placeholder="7" required>
          </label>
          <div></div>
        </div>

        <div class="actions">
          <button type="submit" class="primary" id="submit-btn">Add product</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
          <button type="button" class="danger" id="delete-all-btn">Delete all</button>
        </div>
      </form>
    </section>

    <section class="panel toolbar">
      <label>
        Search by product name
        <input type="search" id="search" placeholder="Search product…">
      </label>
      <label>
        Category
        <select id="filter-category">
          <option value="">All categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Food">Food</option>
          <option value="Other">Other</option>
        </select>
      </label>
    </section>

    <p id="result-count" class="result-count"></p>

    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Status</th>
              <th>Inventory value</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-table"></tbody>
        </table>
      </div>
      <p id="empty" class="empty">No products yet.</p>
    </section>
  </div>

  <script>
    // ---- constants ---------------------------------------------------------
    const STORAGE_KEY = "products";

    // ---- DOM references ----------------------------------------------------
    const form = document.getElementById("product-form");
    const editIdInput = document.getElementById("edit-id");
    const productIdInput = document.getElementById("product-id");
    const nameInput = document.getElementById("name");
    const categoryInput = document.getElementById("category");
    const priceInput = document.getElementById("price");
    const quantityInput = document.getElementById("quantity");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const deleteAllBtn = document.getElementById("delete-all-btn");
    const tableBody = document.getElementById("product-table");
    const emptyMsg = document.getElementById("empty");
    const searchInput = document.getElementById("search");
    const filterCategory = document.getElementById("filter-category");
    const resultCount = document.getElementById("result-count");
    const messageEl = document.getElementById("message");
    const statTotal = document.getElementById("stat-total");
    const statValue = document.getElementById("stat-value");
    const statLow = document.getElementById("stat-low");

    // ---- helpers -----------------------------------------------------------
    const money = function (n) {
      return "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    };

    // Quantity 0 = Out of Stock, 1–4 = Low Stock, 5+ = Available.
    function getStockInfo(quantity) {
      if (quantity === 0) return { label: "Out of Stock", className: "out" };
      if (quantity < 5) return { label: "Low Stock", className: "low" };
      return { label: "Available", className: "" };
    }

    // READ: loads the product array from localStorage (or [] if empty).
    function getProducts() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    // Saves the full product array back into localStorage as JSON.
    function saveProducts(products) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    // Shows a short success/error banner, then hides it after ~2.8s.
    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "msg show " + type;
      setTimeout(function () {
        messageEl.className = "msg";
      }, 2800);
    }

    // Clears the form and exits "edit mode" back to "add mode".
    function resetForm() {
      form.reset();
      editIdInput.value = "";
      submitBtn.textContent = "Add product";
      cancelBtn.hidden = true;
    }

    // Validates one product record. Returns an error string, or "" when valid.
    function validate(record, products, editingId) {
      if (!record.id || !record.name || !record.category || record.price === "" || record.quantity === "") {
        return "Please fill in all fields.";
      }
      if (!Number.isFinite(record.price) || record.price < 0) {
        return "Price cannot be negative.";
      }
      if (!Number.isInteger(record.quantity) || record.quantity < 0) {
        return "Quantity must be a whole number, 0 or more.";
      }
      const duplicate = products.some(function (p) {
        return p.id.toLowerCase() === record.id.toLowerCase() && p.id !== editingId;
      });
      if (duplicate) {
        return "Product ID already exists.";
      }
      return "";
    }

    // Recomputes the three statistic cards from the full product list.
    function renderStats(products) {
      const total = products.reduce(function (sum, p) {
        return sum + p.price * p.quantity;
      }, 0);
      const low = products.filter(function (p) {
        return p.quantity > 0 && p.quantity < 5;
      }).length;

      statTotal.textContent = products.length;
      statValue.textContent = money(total);
      statLow.textContent = low;
    }

    // Reads the search box + category filter.
    function matchesFilters(product) {
      const query = searchInput.value.toLowerCase().trim();
      if (filterCategory.value && product.category !== filterCategory.value) return false;
      return !query || product.name.toLowerCase().includes(query);
    }

    // Builds one table cell whose text is set with textContent (no HTML injection).
    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    /*
      READ (display):
      1. Load all products from localStorage.
      2. Apply search + category filter.
      3. Rebuild table rows, status badges, and quantity controls.
      4. Refresh statistics, result count, and empty-state message.
    */
    function renderProducts() {
      const products = getProducts();
      const filtered = products.filter(matchesFilters);

      tableBody.innerHTML = "";

      filtered.forEach(function (product) {
        const stock = getStockInfo(product.quantity);
        const tr = document.createElement("tr");

        const statusCell = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = "badge " + stock.className;
        badge.textContent = stock.label;
        statusCell.appendChild(badge);

        const qtyCell = document.createElement("td");
        const qtyWrap = document.createElement("span");
        qtyWrap.className = "qty-cell";

        const minusBtn = document.createElement("button");
        minusBtn.type = "button";
        minusBtn.className = "small qty";
        minusBtn.textContent = "−";
        minusBtn.disabled = product.quantity === 0;
        minusBtn.setAttribute("aria-label", "Decrease quantity");
        minusBtn.addEventListener("click", function () {
          changeQuantity(product.id, -1);
        });

        const qtyText = document.createElement("span");
        qtyText.textContent = product.quantity;

        const plusBtn = document.createElement("button");
        plusBtn.type = "button";
        plusBtn.className = "small qty";
        plusBtn.textContent = "+";
        plusBtn.setAttribute("aria-label", "Increase quantity");
        plusBtn.addEventListener("click", function () {
          changeQuantity(product.id, 1);
        });

        qtyWrap.append(minusBtn, qtyText, plusBtn);
        qtyCell.appendChild(qtyWrap);

        const actionsCell = document.createElement("td");
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.className = "small";
        editBtn.type = "button";
        editBtn.addEventListener("click", function () {
          startEdit(product.id);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "small danger";
        deleteBtn.type = "button";
        deleteBtn.addEventListener("click", function () {
          deleteProduct(product.id);
        });

        actionsCell.append(editBtn, " ", deleteBtn);

        tr.append(
          cell(product.id),
          cell(product.name),
          cell(product.category),
          cell(money(product.price)),
          qtyCell,
          statusCell,
          cell(money(product.price * product.quantity)),
          actionsCell
        );
        tableBody.appendChild(tr);
      });

      emptyMsg.style.display = filtered.length === 0 ? "block" : "none";
      emptyMsg.textContent = products.length === 0
        ? "No products yet."
        : "No products match these filters.";

      resultCount.textContent = filtered.length + " of " + products.length + " products";
      renderStats(products);
    }

    // UPDATE (quantity): +/− buttons. Never goes below 0.
    function changeQuantity(id, delta) {
      const products = getProducts();
      const product = products.find(function (p) {
        return p.id === id;
      });
      if (!product) return;

      product.quantity = Math.max(0, product.quantity + delta);
      saveProducts(products);
      renderProducts();
    }

    // CREATE + UPDATE: runs when the form is submitted.
    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const products = getProducts();
      const editingId = editIdInput.value;

      const record = {
        id: productIdInput.value.trim(),
        name: nameInput.value.trim(),
        category: categoryInput.value,
        price: priceInput.value === "" ? "" : Number(priceInput.value),
        quantity: quantityInput.value === "" ? "" : Number(quantityInput.value)
      };

      const error = validate(record, products, editingId);
      if (error) {
        showMessage(error, "err");
        return;
      }

      if (editingId) {
        // UPDATE path: replace the product that was loaded into the form.
        const index = products.findIndex(function (p) {
          return p.id === editingId;
        });
        if (index === -1) {
          showMessage("Product not found.", "err");
          return;
        }
        products[index] = record;
        showMessage("Product updated.", "ok");
      } else {
        // CREATE path: append the new product.
        products.push(record);
        showMessage("Product added.", "ok");
      }

      saveProducts(products);
      resetForm();
      renderProducts();
    });

    // Loads one product into the form so the user can UPDATE it.
    function startEdit(id) {
      const product = getProducts().find(function (p) {
        return p.id === id;
      });
      if (!product) return;

      editIdInput.value = product.id;
      productIdInput.value = product.id;
      nameInput.value = product.name;
      categoryInput.value = product.category;
      priceInput.value = product.price;
      quantityInput.value = product.quantity;
      submitBtn.textContent = "Update product";
      cancelBtn.hidden = false;
      nameInput.focus();
    }

    // DELETE: confirms, removes one product by ID, then re-renders.
    function deleteProduct(id) {
      if (!confirm("Delete product " + id + "?")) return;

      saveProducts(getProducts().filter(function (p) {
        return p.id !== id;
      }));

      if (editIdInput.value === id) {
        resetForm();
      }

      showMessage("Product deleted.", "ok");
      renderProducts();
    }

    // DELETE ALL: clears every product after confirmation.
    function deleteAllProducts() {
      const products = getProducts();
      if (products.length === 0) {
        showMessage("No products to delete.", "err");
        return;
      }

      if (!confirm("Delete ALL " + products.length + " products?")) return;

      saveProducts([]);
      resetForm();
      showMessage("All products deleted.", "ok");
      renderProducts();
    }

    // ---- event wiring ------------------------------------------------------
    cancelBtn.addEventListener("click", resetForm);
    deleteAllBtn.addEventListener("click", deleteAllProducts);
    searchInput.addEventListener("input", renderProducts);
    filterCategory.addEventListener("change", renderProducts);

    // Initial READ when the page loads.
    renderProducts();
  </script>
</body>
</html>
